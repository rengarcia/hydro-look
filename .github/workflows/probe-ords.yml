name: ORDS historian probe

# The experiment PLAN.md §2.1 asked for: do `pointValues*` return values at some hours of the
# day? Eleven read-only requests, nothing written under data/. PLAN.md records the blank window
# as resolved, so the three-a-day schedule that mapped it is down to a weekly check that the
# historian still answers; dispatch it by hand to probe a particular hour.
on:
  workflow_dispatch:
  schedule:
    - cron: "5 13 * * 3"

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Probe
        run: npm run probe:ords -- --out "$RUNNER_TEMP/probe" 2>&1 | tee "$RUNNER_TEMP/probe.log"
      - name: Summarise
        if: always()
        run: cat "$RUNNER_TEMP/probe/probe.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-ords-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/probe
            ${{ runner.temp }}/probe.log
          retention-days: 30
