name: Daily ingest

# Two runs a day, both after the source has published:
#  - 12:15 UTC (07:15 in Ecuador) for the CELEC ORDS, once the local midnight point exists;
#  - 16:30 UTC (11:30 local) for SMEC, which closes the previous day around 11:15 local.
# Each run also re-reads the trailing year and six months from the 12m reports, so a gap
# left by a failed run repairs itself without a manual backfill.
on:
  # workflow_dispatch and schedule only register once the file reaches the default branch.
  # Until this branch merges, a push of the ingest code runs the daily ingest once, which is
  # how the pipeline is validated against the live sources. Remove this trigger after merging.
  push:
    branches: ["claude/gallant-ptolemy-oz9owd"]
    paths:
      - ".github/workflows/daily.yml"
      - "src/**"
      - "scripts/ingest.ts"
      - "package-lock.json"
  schedule:
    - cron: "15 12 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many recent days to re-read (default 1)"
        required: false
        default: "1"
      dry_run:
        description: "Parse and validate without writing"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Ingest
        id: ingest
        env:
          DAYS: ${{ github.event.inputs.days || '1' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: npm run ingest -- daily --days "$DAYS" $DRY_RUN 2>&1 | tee "$RUNNER_TEMP/ingest.log"

      - name: Commit data
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Daily ingest $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-log-${{ github.run_id }}
          path: ${{ runner.temp }}/ingest.log
          retention-days: 14

      # A source that changes shape must be loud: the run fails, the raw response is already
      # archived, and the issue carries the log so the parser can be fixed from it.
      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily ingest failed (${new Date().toISOString().slice(0, 10)})`;
            const body = [
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The raw responses are archived under `data/raw/`, so a parser fix can be tested',
              'against them without re-fetching. See the `ingest-log` artifact for the errors.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'ingest-failure',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['ingest-failure'],
              });
            }
