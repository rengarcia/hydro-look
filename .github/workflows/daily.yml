name: Daily ingest

# Two runs a day, both after the source has published:
#  - 12:47 UTC (07:47 in Ecuador) for the CELEC ORDS, once the local midnight point exists;
#  - 16:53 UTC (11:53 local) for SMEC, which closes the previous day around 11:15 local.
# Odd minutes on purpose. GitHub delays scheduled runs on busy minutes, and :15 and :30 are busy
# minutes: the first two scheduled runs, for the old 12:15 and 16:30 slots, started at 16:58 and
# 19:47. freshness.yml notices a slot that does not fire at all.
# Each run also re-reads the trailing year and six months from the 12m reports, and the last
# three days of the per-day reports, so a gap left by a failed run repairs itself without a
# manual backfill.
#
# Three jobs. `fetch` talks to the sources and stages a batch, holding no write token and no
# secret; the batch is uploaded as an artifact before anything tries to apply it, so a run that
# fails to push loses nothing (see the README for replaying one by hand). `apply` merges the batch
# onto the branch tip, models and narrates, and is the only job that can push — and the only one
# in the `ingest` concurrency group, since only the write needs serialising. `report` opens or
# closes the tracking issues.
on:
  schedule:
    - cron: "47 12 * * *"
    - cron: "53 16 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "How many recent days to re-read (default 3)"
        required: false
        default: "3"
      dry_run:
        description: "Parse and validate without writing"
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts

      # Fetch and stage only: nothing under data/ is touched, so the write can be replayed
      # onto whatever the branch holds once the network work is done. Every response is archived
      # in the batch, including non-200 bodies.
      - name: Ingest
        env:
          DAYS: ${{ inputs.days || '3' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: npm run ingest -- daily --days "$DAYS" --out "$RUNNER_TEMP/batch" $DRY_RUN 2>&1 | tee "$RUNNER_TEMP/ingest.log"

      - name: Upload staged batch
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingest-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/batch
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Upload fetch log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ingest-log-${{ github.run_id }}
          path: ${{ runner.temp }}/ingest.log
          retention-days: 14
          overwrite: true

  apply:
    needs: fetch
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One writer at a time, and a queued writer waits rather than replacing the one writing.
    # Only this job is in the group: fetching needs no serialising, so a backfill that spends
    # hours fetching no longer holds the group and no longer makes a daily run wait (or, as the
    # second pending run in the group, get cancelled) behind it.
    concurrency:
      group: ingest
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      models: ${{ steps.models.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # This job holds the push token and the gateway key, so no dependency's install script runs.
      - run: npm ci --ignore-scripts

      - name: Download staged batch
        # A fetch job that staged nothing uploaded nothing; apply-and-push.sh says so and exits 0.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ingest-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/batch

      - name: Apply and commit
        env:
          BRANCH: ${{ github.ref_name }}
          BATCH_DIR: ${{ runner.temp }}/batch
          SUMMARY: ${{ runner.temp }}/summary.md
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/apply-and-push.sh "Daily ingest $(date -u +%Y-%m-%d) (run $RUN_ID)"

      # Runs after the apply, so both models stand on the day that has just landed rather than
      # on yesterday's. They read the committed tables and touch no network, so a failure here
      # is a modelling failure and never a source outage — and `continue-on-error` keeps it
      # from burying an ingest that has already succeeded and pushed. `report` gives a failure
      # here its own issue.
      - name: Model and commit
        id: models
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          BRANCH: ${{ github.ref_name }}
          LOG: ${{ runner.temp }}/forecast.log
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/model-and-push.sh "Models $(date -u +%Y-%m-%d) (run $RUN_ID)"

      # Phase 6b, last: one model-written paragraph over the numbers the step above just pushed.
      # Only after a green ingest and a green model step — a narrative over yesterday's forecast
      # would be the one thing on the page describing the wrong day. It makes the run's only paid
      # call (Vercel AI Gateway), which is why it is `continue-on-error` and why the key is the
      # only secret this workflow reads: without it the command logs one line and writes nothing,
      # and a rerun on unchanged data is a no-op by payload hash. The step summary carries the
      # call's cost and latency and the spend to date. See narrative-and-push.sh.
      - name: Narrative and commit
        if: steps.models.outcome == 'success'
        continue-on-error: true
        env:
          BRANCH: ${{ github.ref_name }}
          STAGE_DIR: ${{ runner.temp }}/narrative
          LOG: ${{ runner.temp }}/narrative.log
          RUN_ID: ${{ github.run_id }}
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: bash .github/scripts/narrative-and-push.sh "Narrative $(date -u +%Y-%m-%d) (run $RUN_ID)"

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apply-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/forecast.log
            ${{ runner.temp }}/narrative.log
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

  # A source that changes shape must be loud: the run fails, the raw response is already
  # archived, and the issue points at the run so the parser can be fixed from its artifacts. One
  # issue per failure mode, commented on while it lasts and closed by the next green run.
  report:
    needs: [fetch, apply]
    if: ${{ always() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FETCH: ${{ needs.fetch.result }}
          APPLY: ${{ needs.apply.result }}
          MODELS: ${{ needs.apply.outputs.models }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        with:
          script: |
            const issues = require('./.github/scripts/issues.cjs');
            const { FETCH, APPLY, MODELS, SCHEDULED } = process.env;
            const today = new Date().toISOString().slice(0, 10);
            const gh = { github, context };

            if (FETCH === 'failure' || APPLY === 'failure') {
              // Manual runs are watched by whoever dispatched them; only a scheduled failure files.
              if (SCHEDULED === 'true') {
                await issues.report(gh, {
                  label: 'ingest-failure',
                  title: `Daily ingest failed (${today})`,
                  body: [
                    `Daily ingest failed: fetch ${FETCH}, apply ${APPLY}.`,
                    '',
                    'The staged batch is in the run\'s `ingest-batch-*` artifact and every raw response,',
                    'non-200 bodies included, is archived in it, so a parser fix can be tested and the',
                    'batch replayed without re-fetching (README, "Replaying a batch").',
                  ].join('\n'),
                });
              }
            } else if (FETCH === 'success' && APPLY === 'success') {
              await issues.resolve(gh, { label: 'ingest-failure' });
            }

            if (MODELS === 'failure') {
              if (SCHEDULED === 'true') {
                await issues.report(gh, {
                  label: 'model-failure',
                  title: `Model step failed (${today})`,
                  body: 'The forecast or adequacy step failed after a successful ingest; the previously committed documents are still published. See the run\'s `apply-log-*` artifact (forecast.log).',
                });
              }
            } else if (MODELS === 'success') {
              await issues.resolve(gh, { label: 'model-failure' });
            }
