name: Weather, ENSO and XM

# Same shape as daily.yml: `fetch` stages both batches with no write token, uploads them before
# anything applies them, `apply` is the one writer (in the `ingest` group), `report` files or
# closes the `covariates-failure` issue.
on:
  schedule:
    # After both daily slots, and on an odd minute for the reason given in daily.yml.
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "ERA5 history start (YYYY-MM-DD; empty refreshes recent weather and forecasts)"
        default: ""
      to:
        description: "ERA5 history end (default: six days ago)"
        default: ""
      max_requests:
        description: "Request budget; historical runs resume completed basin-years"
        default: "100"
      xm_from:
        description: "XM (Colombia) history start (YYYY-MM-DD; empty re-reads the last five weeks)"
        default: ""
      xm_max_requests:
        description: "XM request budget; 11 per month, and a historical run resumes settled months"
        default: "1500"
      dry_run:
        description: "Validate without writing"
        type: boolean
        default: false

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    # The XM history is ~1,400 requests at about 1.4 s each; a routine day is two dozen.
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fetch weather and ENSO
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          MAX_REQUESTS: ${{ inputs.max_requests || '100' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          npm run ingest -- covariates \
            --from "$FROM" --to "$TO" --max-requests "$MAX_REQUESTS" \
            --out "$RUNNER_TEMP/batch" $DRY_RUN 2>&1 | tee "$RUNNER_TEMP/covariates.log"

      # Colombia's side of the interconnection, staged as its own batch so the two never share a
      # write: a failure on XM's host must not hold back ERA5, nor the reverse.
      - name: Fetch XM (Colombia)
        if: always()
        env:
          FROM: ${{ inputs.xm_from }}
          MAX_REQUESTS: ${{ inputs.xm_max_requests || '1500' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          npm run ingest -- xm --from "$FROM" --max-requests "$MAX_REQUESTS" \
            --out "$RUNNER_TEMP/batch-xm" $DRY_RUN 2>&1 | tee "$RUNNER_TEMP/xm.log"

      # Two artifacts rather than one of two directories: an artifact is rooted at its paths'
      # common parent, so one holding whichever batch happened to exist would change shape.
      - name: Upload staged weather batch
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: covariates-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/batch
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - name: Upload staged XM batch
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xm-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/batch-xm
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true
      - name: Upload fetch logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: covariates-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/covariates.log
            ${{ runner.temp }}/xm.log
          if-no-files-found: ignore
          retention-days: 30
          overwrite: true

  apply:
    needs: fetch
    if: ${{ !cancelled() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The writer queue shared with daily.yml and backfill.yml; see daily.yml.
    concurrency:
      group: ingest
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # A fetch step that staged nothing uploaded nothing; apply-and-push.sh says so and exits 0.
      - name: Download staged weather batch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: covariates-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/batch
      - name: Download staged XM batch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: xm-batch-${{ github.run_id }}
          path: ${{ runner.temp }}/batch-xm
      - name: Apply and commit weather and ENSO
        env:
          BRANCH: ${{ github.ref_name }}
          BATCH_DIR: ${{ runner.temp }}/batch
          SUMMARY: ${{ runner.temp }}/summary-weather.md
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/apply-and-push.sh "Weather and ENSO (run $RUN_ID)"
      - name: Apply and commit XM
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.ref_name }}
          BATCH_DIR: ${{ runner.temp }}/batch-xm
          SUMMARY: ${{ runner.temp }}/summary-xm.md
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/apply-and-push.sh "XM Colombia (run $RUN_ID)"

  report:
    needs: [fetch, apply]
    if: ${{ always() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FETCH: ${{ needs.fetch.result }}
          APPLY: ${{ needs.apply.result }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
        with:
          script: |
            const issues = require('./.github/scripts/issues.cjs');
            const { FETCH, APPLY, SCHEDULED } = process.env;
            const gh = { github, context };
            if (FETCH === 'failure' || APPLY === 'failure') {
              if (SCHEDULED === 'true') {
                await issues.report(gh, {
                  label: 'covariates-failure',
                  title: `Weather, ENSO and XM failed (${new Date().toISOString().slice(0, 10)})`,
                  body: `Covariates run failed: fetch ${FETCH}, apply ${APPLY}. The staged batches are in the run's \`covariates-batch-*\` and \`xm-batch-*\` artifacts.`,
                });
              }
            } else if (FETCH === 'success' && APPLY === 'success') {
              await issues.resolve(gh, { label: 'covariates-failure' });
            }
