name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Every parser runs against the recorded Phase 0 responses, so CI needs no network.
      - run: npm test
      # Shape, ranges and reference integrity over the committed data. Deliberately without
      # --freshness: that one depends on the clock, so in CI it would turn every pull request
      # red once the data aged a few days, which only teaches people to ignore a red build.
      # The ingest job checks freshness instead, where a stopped feed is news.
      - run: npm run check
      # The forecast end to end against the real committed tables, writing nothing. The unit
      # tests drive the model on synthetic reservoirs, which proves the arithmetic; this proves
      # the ladder still fits and scores on the actual history, which is what would break first
      # when a source changes shape. About twenty seconds, and no network.
      - run: npm run forecast -- --dry-run
