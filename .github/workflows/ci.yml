name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      # The write path's shell: apply-and-push.sh decides what gets committed on every ingest, so it
      # is linted like code (shellcheck ships on the runner image). -x follows the sourced loop.
      - run: shellcheck -x .github/scripts/*.sh
      - run: npm run typecheck
      - run: npm run lint
      # Every parser runs against the recorded Phase 0 responses, so CI needs no network.
      - run: npm test
      # Shape, ranges and reference integrity over the committed data. Deliberately without
      # --freshness: that one depends on the clock, so in CI it would turn every pull request
      # red once the data aged a few days, which only teaches people to ignore a red build.
      # The ingest job checks freshness instead, where a stopped feed is news.
      - run: npm run check
      # The forecast end to end against the real committed tables, writing nothing. The unit
      # tests drive the model on synthetic reservoirs, which proves the arithmetic; this proves
      # the ladder still fits and scores on the actual history, which is what would break first
      # when a source changes shape. About twenty seconds, and no network.
      - run: npm run forecast -- --dry-run
      # The adequacy model, likewise end to end and writing nothing. It carries its own backtest
      # over ninety-nine monthly origins, so this is also the check that the national balance
      # still parses into days the model will accept: a source change that makes half the record
      # unusable shows up here as a failure rather than as a quiet shift in the deficit.
      - run: npm run adequacy -- --dry-run
      # The public current-state document, built and discarded. It is what the site's tiles read,
      # so a change that leaves a reservoir without a level should be red here and not on the page.
      - run: npm run publish:api -- --dry-run
      # The narrative payload, built from the committed documents and printed. No key and no
      # network: `--dry-run` never calls the gateway. A document the payload builder can no longer
      # read — a renamed field in forecast.json, say — fails here rather than on the daily run.
      - run: npm run narrative -- --dry-run
      # The site itself. It renders at build time from data/curated and public/api, which means a
      # column renamed in a table is a broken build rather than a page that quietly prints a dash
      # for a week. No network: every number it needs is in the checkout.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
