name: Phase 0 reconnaissance

# One-off discovery run: captures raw responses from every candidate data
# source into tests/fixtures/ and commits them with a report. Manual only: it is on the default
# branch, so a dispatch names the ref to run and no push trigger is needed.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated sections (tls,ords_matrix,ords,ords_catalog,ords_reports,ords_new_mrids,ords_history,celec_web,smec,operativa,covariates,mirrors,open_data,xm); empty = all"
        required: false
        default: ""

permissions: {}

concurrency:
  group: recon
  cancel-in-progress: false

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: pip install -r scripts/recon/requirements.txt

      - name: Capture
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: python scripts/recon/capture.py --capture "$RUNNER_TEMP/recon-capture" --only "$ONLY"

      - name: Upload full capture (including large bundles) as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recon-capture-${{ github.run_id }}
          path: ${{ runner.temp }}/recon-capture
          if-no-files-found: warn
          retention-days: 30

      - name: Commit fixtures and report
        if: always()
        # Through the environment, not interpolated into the script, so a ref name is data and
        # never shell.
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures scripts/recon/RECON_REPORT.md
          if git diff --cached --quiet; then
            echo "No fixture changes."
          else
            git commit -m "Phase 0: capture reconnaissance fixtures and report (run $RUN_ID)"
            # re-runs check out an older commit; rebase onto the branch tip before pushing
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
