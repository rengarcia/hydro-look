name: Release bulk tables

# Once a day, after both ingest slots, attach every curated table to one rolling release:
# `<table>.csv.gz` (the same files the site serves at /api/bulk/) and a Parquet copy of each for
# consumers who would rather not parse CSV. The release is `bulk-latest`, overwritten in place;
# the history of every row is the repository itself, so nothing here needs keeping twice.
#
# Self-contained on purpose: it reads the committed tables, writes nothing to the repository, and
# needs no secret beyond the job's own token. It pushes no commit and shares no concurrency group
# with the ingest.

on:
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-bulk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUCKDB_VERSION: v1.1.3
    steps:
      - run: echo "BULK_DIR=$RUNNER_TEMP/bulk" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the csv.gz files
        run: npm run export:bulk -- --out "$BULK_DIR"
      - name: Install the DuckDB CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" \
            "https://github.com/duckdb/duckdb/releases/download/${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip"
          unzip -o -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/duckdb" --version
      - name: Convert each table to Parquet
        # Types are inferred from the whole file (sample_size = -1), so a column whose first
        # thousand rows look numeric and whose later rows do not is typed as text, not truncated.
        run: |
          for gz in "$BULK_DIR"/*.csv.gz; do
            table="$(basename "$gz" .csv.gz)"
            "$RUNNER_TEMP/duckdb" -c "COPY (SELECT * FROM read_csv('$gz', header = true, sample_size = -1)) TO '$BULK_DIR/$table.parquet' (FORMAT parquet, COMPRESSION zstd)"
          done
          ls -la "$BULK_DIR"
      - name: Publish to the bulk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view bulk-latest --repo "$REPO" > /dev/null 2>&1; then
            gh release create bulk-latest --repo "$REPO" --prerelease --title "Bulk tables (rolling)" \
              --notes "Every curated table as csv.gz and Parquet, rebuilt daily from main. See /datos/ on the site for fields and units."
          fi
          gh release upload bulk-latest --repo "$REPO" --clobber "$BULK_DIR"/*.csv.gz "$BULK_DIR"/*.parquet "$BULK_DIR"/index.json
