name: Backfill

# Manual, chunked and resumable. Every command skips days already in the store, so a long
# history is filled by dispatching the same inputs repeatedly until the run reports no new rows.
#
# Two budgets bound a run. The request budget bounds how much is asked for; the time budget
# (--max-minutes, set below to well under the job timeout) guarantees the run stops fetching in
# time to archive, apply and push what it has. That matters because a staged run writes nothing
# until fetching ends, so a job killed by the timeout would lose hours of collected responses.
#
# Throughput is not one request per second: the client waits --rate-ms *after* each response,
# so a request costs its own latency plus the gap, about 1.4 s against these hosts. Budget
# roughly 1,500 requests per wall-clock hour, not 3,600.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which backfill to run ('all' spends the budget in priority order)"
        type: choice
        required: true
        default: all
        options:
          - all
          - ords-levels
          - ords-energy
          - ords-basin
          - smec
          - ords-plant-energy
          - ords-historian
          - ords-daily
      from:
        description: "First day, YYYY-MM-DD (levels reach 2014-09-20, SMEC 2016-05-01 or earlier; ords-historian pages by month)"
        required: true
      to:
        description: "Last day, YYYY-MM-DD (default: yesterday)"
        required: false
        default: ""
      max_requests:
        description: "Request budget for this run (~1,500/hour in practice; 10000 ≈ 6-7h, so the time budget usually binds first)"
        required: false
        default: "10000"
      max_minutes:
        description: "Wall-clock budget for fetching, leaving the rest of the job to apply and push"
        required: false
        default: "270"
      plants:
        description: "Plant codes for ords-plant-energy (default ago,man,ccs)"
        required: false
        default: "ago,man,ccs"
      dry_run:
        description: "Parse and validate without writing"
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      - name: Backfill
        env:
          SOURCE: ${{ inputs.source }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          MAX_MINUTES: ${{ inputs.max_minutes }}
          PLANTS: ${{ inputs.plants }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          npm run ingest -- backfill \
            --source "$SOURCE" \
            --from "$FROM" \
            ${TO:+--to "$TO"} \
            --max-requests "$MAX_REQUESTS" \
            --max-minutes "$MAX_MINUTES" \
            --plants "$PLANTS" \
            --out "$RUNNER_TEMP/batch" \
            $DRY_RUN 2>&1 | tee "$RUNNER_TEMP/backfill.log"

      - name: Apply and commit
        if: always() && !inputs.dry_run
        env:
          SOURCE: ${{ inputs.source }}
          FROM: ${{ inputs.from }}
          BRANCH: ${{ github.ref_name }}
          BATCH_DIR: ${{ runner.temp }}/batch
        run: bash .github/scripts/apply-and-push.sh "Backfill $SOURCE from $FROM (run ${{ github.run_id }})"

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-log-${{ github.run_id }}
          path: ${{ runner.temp }}/backfill.log
          retention-days: 30
